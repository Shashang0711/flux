# Local infrastructure for development. Run: docker compose up -d
# Host port defaults to 5433 so it can run alongside a locally installed Postgres on 5432.
# Override with POSTGRES_PORT=5432 docker compose up -d (and update DATABASE_URL to match).
# Matches DATABASE_URL in apps/api/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - flux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flux']
      interval: 5s
      retries: 10

volumes:
  flux-pg:
