# Local infrastructure for development. Run: docker compose up -d
# Matches DATABASE_URL in apps/api/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    ports:
      - '5432:5432'
    volumes:
      - flux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flux']
      interval: 5s
      retries: 10

volumes:
  flux-pg:
