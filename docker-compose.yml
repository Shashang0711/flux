# Full local stack: Postgres, API and web. Run: docker compose up -d --build
# Then open http://localhost:3000 (API on http://localhost:4000/api/v1).
#
# Host ports can be overridden: POSTGRES_PORT (default 5433, so it can run alongside a locally
# installed Postgres on 5432), API_PORT (default 4000), WEB_PORT (default 3000).
# To run only the database and use `npm run dev` for the apps: docker compose up -d postgres
# (files then go to apps/api/storage). For S3-compatible storage too: docker compose up -d postgres
# seaweedfs, and set STORAGE_DRIVER=s3 plus the S3_* values shown for the api below (endpoint
# http://localhost:8333).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - flux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flux']
      interval: 5s
      retries: 10

  # S3-compatible object storage for uploaded files (SeaweedFS's S3 gateway; any S3 service
  # works). Credentials are in docker/seaweedfs-s3.json — local development only.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - flux-files:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Any HTTP answer (anonymous requests get 403) means the gateway is up.
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8333 2>&1 | grep -q HTTP/']
      interval: 5s
      retries: 20

  # Catches outgoing email locally: nothing leaves the machine. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'

  api:
    build:
      context: .
      target: api
    init: true
    environment:
      PORT: 4000
      # Inside the compose network Postgres is reached by service name on its container port.
      DATABASE_URL: postgresql://flux:flux@postgres:5432/flux?schema=public
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      LOG_LEVEL: info
      # Served over plain HTTP locally, so the session cookie must not require HTTPS.
      COOKIE_SECURE: 'false'
      # Requests arrive via the web container on the private compose network; trust it so the
      # API sees the real client IP (used by the per-IP login rate limit).
      TRUST_PROXY: 'loopback, uniquelocal'
      # Bootstrap admin, created on start if it does not exist yet. Set FLUX_ADMIN_PASSWORD
      # (8+ characters) in a .env file next to this compose file; if unset, seeding is skipped.
      FLUX_ADMIN_EMAIL: ${FLUX_ADMIN_EMAIL:-admin@flux.local}
      FLUX_ADMIN_NAME: ${FLUX_ADMIN_NAME:-Platform Administrator}
      FLUX_ADMIN_PASSWORD: ${FLUX_ADMIN_PASSWORD:-}
      # Uploaded files: private bucket in SeaweedFS, downloaded through signed links.
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: flux-files
      S3_ACCESS_KEY_ID: flux
      S3_SECRET_ACCESS_KEY: flux-s3-dev-secret
      # Create the bucket on start (local only; in production the bucket is managed separately).
      S3_CREATE_BUCKET: 'true'
      # Notification emails go to Mailpit (see its inbox at http://localhost:8025).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: FLUX <no-reply@flux.local>
      # Signs download links. Development default only: set your own (32+ characters) in .env.
      FILE_URL_SECRET: ${FILE_URL_SECRET:-local-development-only-not-a-secret-0001}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      target: web
    init: true
    environment:
      # Server-side calls go to the API container directly.
      API_BASE_URL: http://api:4000/api/v1
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  flux-pg:
  flux-files:
